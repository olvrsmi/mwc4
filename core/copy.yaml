# ---------------------------------------------------------------------------
# Beats — the scripted moments of the probation week.
#
# A SETPIECE is keyed to a day and fires once, ever, when that day of probation
# begins. `schedule` says which beat belongs to which day; a day with no entry
# passes without one.
#
# Choices colour the reply and nothing else: the player picks, the beat answers,
# and the game is where it was. They may carry a small effect - `coherence` as a
# delta, `unlock` as a marketplace item id - and those apply when the choice is
# taken. Put an effect on the beat itself to have it apply however they answer.
#
# Choices are keyed rather than listed (a, b, c...) because the key is the token
# the player replies with, and because copy-check can only see inside objects -
# a list of choices would ship unvalidated.
#
# A beat can arrive mid-round. It does not interrupt a position: the readouts
# keep coming and the choice can be answered whenever.
#
# `again` is for a desk having another go. Probation setpieces fire once ever,
# so a second attempt would otherwise be silent - these are the sound of a
# floor that carries on. One is picked at random.
# ---------------------------------------------------------------------------
beats:
  schedule:
    2: change1
    3: the_himbo
    4: change2

  # {day} {budget} {attempt}
  change1:
    voice: player
    text: |
      _[your mouse feels different today, not massively but the texture's changed. Is it a bit heavier too?]_

  change2:
    text: |
      **Navinder stops at your desk.**

      You're a wizz on that machine, huh. How's it going newbie?"
    choices:
      a:
        label: Who switched your mouse
        reply: |
          "Hahaha. Why would someone do that? I told you to make sure you invested at a distance, didn't I?"
        coherence: 0.04
      b:
        label: Offer similar platitudes
        reply: |
          Head's still in the game, huh? No bother, but do watch out for things starting to feel different.
  the_himbo:
    text: |
      **Daniel has a theory.**

      "So right — the CHEAP ones. Nobody's watching the cheap ones." He is
      delighted. He has been here four months.
    choices:
      a:
        label: Humour him
        reply: |
          "See, you get it." He tells three other people you agreed with him.
      b:
        label: Point at the quota
        reply: |
          "Oh, the quota." His face does something complicated. "Yeah. No, the
          quota's the thing, isn't it."

  # A desk on its second attempt or later. Randomised, and deliberately small.
  again:
    - _Nobody looks up when you sit down._
    - _The terminal remembers your layout. Somebody's does, anyway._
    - _Someone has left a coffee on desk B. It is not yours and it is not warm._

# ---------------------------------------------------------------------------
# Sequences — scripted scenes, played a node at a time.
#
# Everything up to the next thing the scene wants from the player is sent in one
# burst, a beat apart. See BEATS.md for the whole schema; in short, a node may
# carry `art`, `speaker`, `text`, `choices` (keyed a, b, c... — any number), and
# `ask` (capture what they type next into a named variable).
#
# Choices colour the moment and rejoin: each one's `reply` plays, then the
# sequence carries on from the next node. There is no branching to track.
#
# `art` names a file in server/art/. A name with no file is skipped silently, so
# a scene can be written before it is drawn.
# ---------------------------------------------------------------------------
# The scenes of a first sitting, in order. Each plays once; when one ends the
# next begins, and when the last is done the game starts. Add a scene here and
# it joins the opening - the engine does no chaining of its own.
# The scene `help` reads out again, at any moment. It must not stop to ask
# anything - see the note above that scene. Defaults to `voice` when absent.
help_scene: tutorial

opening:
  - intro
  - office
  - tutorial
  - orientation

sequences:
  intro:
    - art: himbo
      speaker: Daniel
      text: |
        There you are, you made it past security. I should tell them to sharpen up haha

        _Holds out lanyard_
      choices:
        a:
          label: Take it
          speaker: Daniel
          reply: |
            Thats you, welcome to MWC. Welcome to the future!
            
            Follow me.

    - voice: player
      text: |
        _[You follow Daniel to the lift, remembering him exuding the same kind of hopeful energy throughout your entire 15 round, 12 minute interview process.]_

    - speaker: Daniel
      text: |
        We're floors 11 and up, used to have quants in the basement, closer to the cables, but apparently latency’s not really an issue with neo-markets.

        You'll be on 17, office 178, desk B. look for Navinder, they've set him up doing intros. Don't take it personal, that's just how he is.

      choices:
        a:
          label: Call the lift
          speaker: Daniel
          reply: |
            You go get 'em, haha!
        b:
          label: Do nothing
          speaker: Daniel
          reply: |
            _Presses lift button_

            Yea we still have the old style

    -  text: |
        ...
    
    - text: | 
        _ding_ 
    
    - text: |
        Catch you on a drinkfood break maybe, have a good one.

    - voice: player
      text: |
        _The lift creaks into place and the doors open, 12 industrial revolutions down and we still haven't got the one that solves for general maintenance. You step in._

      choices:
        a:
          label: "[17]"
          voice: player
          reply: |
            _Well remembered, you feel like you're being tested somehow, even now. Doors close and the lift starts to move..._
        b:
          label: "[-1]"
          voice: player
          reply: |
            _Oops, you catch yourself in time and press 17. The lift closes and carries you up..._
        c:
          label: "[??]"
          voice: player
          reply: |
            _No response. Thankfully. You hit 17 and the lift starts to move..._

  
  # Specified later. An empty sequence simply does not play, so this can sit
  # here unfinished without affecting anything.
  office: 
    - text: _You step out at floor 17 and fail to orient yourself, only when you pass the lift for the 4th or 5th time do you spot the door to office 178._
      voice: player

    - text: _You push open the door and see Navinder stood staring out the window, he's the only other person in there_
      voice: player
      choices:
        a:
          label: "Say 'hi'"        
          speaker: Navinder
          reply: |
            ...
        b:
          label: "Look for desk B"
          speaker: Navinder
          reply: |
            ...

    - text: _You sit down at desk B and boot the terminal. You scan your pass when prompted, input the second and third factor authentications from your phone and watch, and put your first three fingers in the scanner_
      voice: player

    - art: oldhead
      speaker: Navinder
      text: |
        Hey newbie. Start off with the founder welcome or I’ll be in trouble.

        _Your desktop spreads across the 6 screens in front of you, there's only two icons_
      choices:
        a:
          label: "hiya.mp4"
          speaker: Navinder
          reply: |
            Keep your eyeballs forward, they track that shit.
        b:
          label: "Metrics_FINAL.mov"
          speaker: Navinder
          reply: |
            Ah not that one! Come on now.

            _Clicks 'hiya.mp4' for you, gestures at the webcam_

            Try and appear focussed, at least, for the cameras.

    - art: founders
      speaker: Lara
      text: |
        Hi!

    - speaker: Martin
      text: Hey! Welcome to the team
      choices:
        a:
          label: "wave"
          speaker: Navinder
          reply: |
            ... it's prerecorded
        b:
          label: "do nothing"
          speaker: Navinder
          reply: |
           That's right, keep the focus

    - speaker: Lara + Martin
      text: |
        When we started Mackenzie Walk Capital we had nothing but a dream, a huge roster of investors enamoured with youth from our time at Jane Street and Goldman Sachs, and a willingness to Do What It Takes.
        
        We look forward to meeting you after your first week, in our scheduled, new starter 37 second catch up. Remember, Do What It Takes!

    - art: oldhead
      speaker: Navinder
      text: |
        Right, right. Let me show you round the FOOMBERG terminal.

  # The voice, on its own, because /help plays it again. Splitting it out is
  # what stops the words existing twice: a second copy for /help would drift
  # from this one the first time either was edited. It runs in its place in
  # the opening because `opening` chains whatever it lists.
  #
  # Keep it free of choices and asks. /help can arrive mid-position, and a
  # scene that stops to ask something would leave the player holding a
  # question instead of a holding - copy-check refuses one.
  tutorial:
    - speaker: Disembodied Voice
      text: |
        _A disembodied voice starts talking, Navinder doesn't stop explaining (maybe he can't hear it) but you can't hear him any more. It's weirdly present, and feels like some placeholder text in an unfinished world to you..._

        **The Markets**
        Welcome to Mackenzie Walk Capital, a post AGI investment company focussed on Neo-markets. You'll need to make a significant profit in your first week to pass probation and impress the founders.
        
        Since AGI took off in late 2028 Neo-markets have become a significant focus of investment and it’s estimated that the number of these increasingly small markets (betting on the changes of atomic or subatomic systems) doubles every 3 days, and this rate of doubling has itself doubled in the last month. There are rumours, posts, unsubstantiated pieces of independent research, and even a few early Arxiv.org preprints that suggest that observing, modelling and investing in these systems is changing them, scare words like decoherence, collapse are beginning to float around the discourse.

    - speaker: Disembodied Voice
      text: |
        **The Terminal**

        On your desk is a FOOMBERG™ terminal, a self-improving, AGI-inside investment terminal specialising in neo-markets. MWC's unique approach is to pair the power of the terminal with the sense making capabilities of its user, following the go-getting early industrial model of canaries and coalminers.

        The terminal will present you with three possible neo markets at any one time. These each have differing numbers of investment opportunities.

        On entering the market the terminal gives you a readout of its structure followed by a graph of the current standing of all entities.

        You can invest straight away, observe the market's progress, or leave and choose another from the three. You must invest, MWC doesn't appreciate timidity. If you don't, you'll fail.

     

    - speaker: Disembodied Voice
      text: |
        **Investment**

        When you invest you stake some of your day's funds on one of the entities, but you also couple your terminal with the entity. This is the only way to exploit neo-markets (and it's totally fine btw, no negative externalities).

        This coupling can change the outcome of the market, and skilled traders can sense when and how to invest even if the entity doesn't look clasically profitable.

        The coupling also changes the state of your terminal, causing it to lose coherence and necessitating some recovery time, particularly from bad trades. The company has an internal marketplace from which you can purchase upgrades to the recovery process.

    - speaker: Disembodied Voice
      text: |
        **Probation**

        This first week is your probation week. You need to prove your worth before you get to keep a cut of the profits as your salary. 
        
        - Probation week is a 7 day working week 
        - you receive a {daily_budget} baseline daily budget 
        - if you end the day with a more than 10% profit your budget is increased by 10% the next day
        - if not, it's reduced by 5%
        - you must make a profit of 50% or more of your weekly total budget - {week_target} at baseline, but subject tochange as your budget does
        - if you fail you can keep trying, but normally only the nepo-hires have funds for that

  # --- the verdicts ---------------------------------------------------------
  #
  # The end of a probation week, as a scene rather than a line: characters can
  # come over, say something, and be answered. They read the week's numbers -
  # {total} {attempt} {failures} {again} {budget} {coherence} - and a choice may
  # carry `coherence:` or `unlock:` exactly as a beat's does.
  #
  # Passing happens once, so it has one scene. Failing repeats, so the full
  # scene plays on the first failure and `probation_failed_again` after that.
  # Leave that one empty and the full scene plays again instead.
  probation_passed:
    - title: "Seven days. {total}."
      text: |
        You are off probation. The desk is yours.

  probation_failed:
    - title: "Seven days. {total}."
      text: |
        Not a profitable week, so not yet a desk. You start again on {budget}{#if again} — attempt {attempt}{/if}.

        Your qubit is where you left it, at {coherence}. That much is yours.

  # Shorter, for the second failure onward. Empty until it is written.
  probation_failed_again: []

  # Navinder again, once the voice has finished. Its own scene only because
  # the voice between them is one - see the note above `voice`.
  orientation:
    - art: oldhead
      speaker: Navinder
      text: |
        Got that?
      choices:
        a:
          label: yes, thanks!
          voice: player
          reply: |
            _you think so, anyway... you spotted a `/help` option you can use later at least_
        b:
          label: ask for a repeat
          voice: player
          reply: |
            _You start to ask him to repeat but remember you spotted a `/help` option, you can just use that_

    - speaker: Navinder
      text: |
        Alright, make good trades and try not to fundamentally alter the fabric of reality.
      choices:
        a:
          label: seems normal
          voice: player
          reply: |
            _You smile and nod as your head turns back to the terminal. Time to make some money._
        b:
          label: ignore the implications
          voice: player
          reply: |
            _You smile and nod as your head turns back to the terminal. Time to make some money._
