# =============================================================================
# Office 4B, 6 Mackenzie Walk — every word the player reads.
#
# Edit this file freely. The bot reloads it on save; nothing needs restarting
# and nobody's position is lost. If something here is wrong the message says so
# rather than the round ending, and the console names the key.
#
# Values in {braces} are supplied by the engine, already formatted — {balance}
# is "1,000G", {coherence} is "0.999". Each message below lists what it can use.
#
# When prose needs to bend there are escape hatches:
#   {n} opportunit{n|s:y:ies}          singular or plural
#   {#if recovering} (…){/if}          only when true
#   {#if x}this{:else}that{/if}        one or the other
#   {balance_raw|money}                re-format a raw number yourself
#
# Anywhere a list is given, one line is chosen at random.
# Run `npm run copy-check` to confirm nothing is missing or misspelt.
# =============================================================================

# ---------------------------------------------------------------------------
# Timing — how long each message waits before it arrives, in SECONDS.
#
# A turn can produce several messages. Without this they all land in the same
# instant and a scene written as someone talking stops reading as someone
# talking.
#
#   minimum   the floor under every message, the game's own included. Raise it
#             and the whole game slows; this is the one that stops a burst
#             arriving at once.
#   scene     what a line in a sequence or a beat waits when it says nothing
#             else. Dramatic timing, so it is longer than the minimum.
#   max       a ceiling, so a typo cannot park the game.
#   scenes    a default for one named sequence or beat, overriding `scene`.
#
# Any single line can override all of it with its own `delay:`, which is where
# most of the feel is:
#
#   - text: |
#       ...
#     delay: 3            # a long pause before this line
#   - text: |
#       _ding_
#     delay: 0.4          # and a short one before this
#
# The delay is the gap BEFORE a message. The first message of a turn never
# waits — it is the answer to what the player just did.
# ---------------------------------------------------------------------------
pacing:
  minimum: 0.6
  scene: 1.4
  max: 20

  # Per-scene defaults. The tutorial is four long blocks of reading, so it
  # wants longer than a line of dialogue does.
  scenes:
    tutorial: 3

scenes:

  # The day, established. This is said ONCE, when a day opens - not again
  # between that day's rounds, which are offered on their own. Which is why
  # the week's arithmetic is written out in full here: this is the one place
  # the player is told where they stand.
  #
  # Money in this message is in euro-dollars, the company's unit. Quotes, P/L
  # and returns stay in G, the market's - {balance_raw|euro} converts if a
  # line here wants one of those.
  #
  # {day} {budget} {coherence} {recovering} {recovery} {week_line}
  # {days_left} {target} {target_left} {ahead} {surplus} {made} {week_bonus}
  # {pot} {has_pot} {balance} {pl} {round} {upgrades} {day_left} {probation}
  day_title: "Day {day}"
  day: |
    You have a budget of {budget}.
    {week_line}

    Your terminal's coherence is {coherence}{#if recovering} (recovery in {recovery}){/if}

  # The middle line of the block above. Two of them, because a probation week
  # counts down to a target and an ordinary week counts down to a bonus - and
  # they are separate keys so a writer can see both at once rather than
  # reading them out of a conditional.
  #
  # The target is half of every budget the week is handed, so it is 3,500 on
  # day one and moves from there: clear a day and tomorrow's allowance goes up,
  # and so does what the week wants of you.
  #
  # {days_left} {target} {target_left} {ahead} {surplus} {made} {week_bonus} {pot}
  day_probation: >-
    You have {days_left} day{days_left|s::s} left of probation and
    {#if ahead}are {surplus} clear of the {target} you need to pass.{:else}still
    need to make {target_left} to pass.{/if}

  # The same line, after probation. {made} is what the week has banked so far.
  day_week: >-
    You have {days_left} day{days_left|s::s} left of the week and have made
    {made} so far. A week in profit pays {week_bonus} into your pot.

  # What `status` answers, at any moment. The day block opens a day and then
  # stays said; this is the same standing asked for again, mid-day, so it adds
  # the two numbers that have moved since: how much of the day is left, and
  # what is left of the budget.
  #
  # {week_line} is the same middle line the day block uses - see the two keys
  # above - so the week's arithmetic is written once and read in both places.
  #
  # {day} {steps_left} {week_line} {budget} {coherence} {balance} {recovering}
  # {recovery} {days_left} {target} {target_left} {ahead} {surplus} {made}
  # {week_bonus} {pot} {has_pot} {pl} {upgrades} {probation}
  status_title: Status
  status: |
    It's day {day}, {steps_left} remaining.

    {week_line}

    Today's budget was {budget}.
    Your terminal's coherence is {coherence}{#if recovering} (recovery in {recovery}){/if}
    Your balance is {balance}

  # no values
  offer: Three worlds are open to you.

  # The terminal's report on a world, printed on entering it. The two
  # percentages lead because they are the only figures here that describe the
  # whole market; the complexity word under them is that pair said in English.
  #
  # {world} {opportunities} {complexity} {monopoly} {volatility} {disconnected}
  entered_title: "Report: {world}"
  entered: |
    {monopoly}% corporate monopolisation
    {volatility}% expected volatility
    {complexity}

    {opportunities} investment {opportunities|s:opportunity:opportunities}:
    {rows}

  # one row per holding: {holding} {price} {contracted} {exposure} {exposed}
  overview_row: "`{holding}`  {price} · {contracted}{#if exposed} · exposed to {exposure}{:else} · unexposed{/if}"

  # A chart is sent on its own, with no line under it. The sheet already says
  # which world, how old, how big and what the position is doing, and a caption
  # repeating that is a worse copy of the picture. What a chart says is drawn
  # on it - see `plots:` below.

  # The whole of opening a position: one line, naming the holding and the
  # quote it was taken at. What happens next is on the buttons.
  #
  # {holding} {opened_at} {stake} {target} {last} {every}
  position_open: "Position open on {holding} @ {opened_at}. Holding."

  # The two prices, the two amounts, and what it came to. What the trade cost
  # the terminal is not here - {coherence} and {was_coherence} are supplied if
  # a writer wants it back, and `status` carries it either way.
  #
  # {forced} is a position the bell closed rather than the player: without a
  # word for it, being shut down at the end of the day reads exactly like
  # choosing to close, which is the one thing the player did not do.
  #
  # {holding} {target} {opened_at} {closed_at} {change} {multiplier} {stake}
  # {returned} {profit} {balance} {outcome} {coherence} {was_coherence}
  # {flat} {drained} {forced}
  returns_title: Returns
  returns: |
    {holding}: open @ {opened_at}, close @ {closed_at}
    Investment {stake} · return {returned}

    **{outcome} {profit}**{#if forced}
    _Closed early: EOD._{/if}

  # {balance}
  ask_stake: "How much do you stake? (1 – {balance})"
  # {last}
  ask_target: "Couple to which holding? (0 – {last})"
  ask_units: How many upgrades?

  left: You leave before anything is committed.
  observed_all: You observed the whole circuit and staked nothing. Your qubit is untouched.
  broke_title: The walk ends here
  broke: You are out of money.
  nothing_to_stake: You have nothing left to stake.
  turn_failed: Something went wrong at this end and your last move was lost. Send anything to pick up where you were.

  # {recharge} {unit_cost} {coherence} {balance} {budget} {bonus} {units}
  # {upgrades} {recovering} {recovery}
  marketplace_title: The workshop
  marketplace: |
    A spent investment-bit cleans up on its own in {recharge}. Each upgrade buys a quarter again, once, for {unit_cost} out of today's budget.

    Coherence {coherence} · today's balance {balance}
    Upgrades owned {upgrades}{#if recovering}
    Clean again in {recovery}{/if}

  # {bought} {spent} {upgrades} {recovery}
  upgraded: "{bought} bought for {spent}. {upgrades} owned — clean-up now takes {recovery}."
  # {cost} {balance}
  cannot_afford: "An upgrade is {cost} and you have {balance}."

  # The bell says what the day came to and what it costs you, in words rather
  # than in a sum: the new budget is named in tomorrow's day block, which is
  # the next thing the player reads.
  #
  # An idle day has no result to give and never clears the target, so it takes
  # the cut like any other missed day.
  #
  # {day} {pl} {good} {traded} {idle} {was_budget} {budget} {change} {floored} {floor}
  day_end_title: The Bell
  day_end: |
    Day {day} closes.  {#if idle}You made no investments today.{:else}Result: {pl}{/if}

    {#if good}You reached your target for the day, and will have an increased budget tomorrow.{:else}You failed to reach your target for the day, your budget will be cut tomorrow.{/if}

  # {total} {paid} {bonus} {pot}
  week_end_title: The week closes
  week_end: |
    Seven days came to {total}.
    {#if paid}A personal bonus of {bonus} has been paid. Your pot stands at {pot}. It cannot be invested.{:else}No bonus this week.{/if}

  # {worlds} {skipped} {recharge}
  welcome_title: OFFICE 4B, 6 MACKENZIE WALK
  welcome: |
    Welcome to Mackenzie Walk Capital, London's premier neo-market-day-trading firm.

    As a quick refresher, neo-markets are ultra-small markets opened up for investment as one of the early benefits of 2028's discovery of AGI. Initially focused on ecosystems and microclimates, with an as-yet unrealised hope that this could allow hedging against climate collapse, the increasing rate of cyborg-centaur-competition has lead to ever smaller markets being discovered. It’s estimated that market count doubles every 3 days, and this rate of doubling has itself doubled in the last month.

    The current state-of-the art is quantum markets, impossibly small in scale. Here at Mackenzie Walk Capital, we pride ourselves on being the first to enter neo-markets, but you know that from the orientation. Despite what happened with the microclimate markets, we're confident that these are small enough that there shouldn't be any negative externalities, it's just a few electrons or whatever.

    So, boot up your FOOMBERG™ terminal, this is where you find markets. As you're a newbie, it'll give you three to choose from and one possible investment-bit. 
    
    This means you can choose one entity in one market to invest in. Pick wisely. Spend some time observing the trajectories before making your decision, but don't wait too long. If the value of the entity is up when you exit, you make money, if it's down you lose it. Simple as that.
    
    When you invest, your investment-bit is coupled with the entity you choose, and it stays coupled until you close the position. Watch it step by step and pull out whenever you like — nothing is committed for you.

    Remember your investment bit will come back changed and you may need to wait for it to clean up ({recharge}).

  # The night, after the bell. It is said every day, not only on a day that
  # spent the terminal: going home is what ends a day, and how much came back
  # is the coherence the next day block opens on.
  #
  # {elapsed} {gained} {recovered}
  night: | 
    _You head home._ 
    
    _Night passes, on your desk your terminal runs its self-improving subroutines, recovering coherence._"

# One of these is chosen at random when a player writes during their own run.
chatter:
  - The circuit is mid-run. Nothing to decide until it settles.
  - Noted. The gates do not care.
  - Still running. You can only watch from here.
  - The stake is placed. It plays out either way.

prompts:
  # {options}
  unknown: "Type {options}."
  help_title: Commands
  help: |
    `status` to see current time, funds and coherence
    You can type any number, as well as selecting presets.
  say_something: Say something, or type **help**.
  # shown when a player types something a running scene has no answer for
  scene_waiting: _Someone is still talking. Answer them, or **skip**._
  nothing_to_decide: Nothing to decide just now.
  # A chat client leaves every keyboard it has ever sent tappable, and the
  # same token means different things in different moments - so a tap on an
  # old message is refused rather than acted on. Shown as a toast on the button.
  stale_button: That moment has passed — use the buttons on the latest message.

buttons:
  invest: Invest
  # `nh` is one neo-hour, the unit under `vocabulary.step` - one world step,
  # which is exactly what either of these buys
  observe: Observe for 1nh
  leave: Leave
  marketplace: Marketplace
  status: Status
  # new in 04: a position is stepped by hand and closed whenever the player says
  hold: Hold for 1nh
  close: Close position
  buy: Buy
  all_stake: "All {amount}"
  stake: "{amount}"
  # {index} {world} {opportunities}
  world: "{index}. {world} — {opportunities} opportunit{opportunities|s:y:ies}"
  qubit: "{holding}"

# The five bands a world's complexity is described by, easiest first.
# Thresholds live in code; add or rename words here and the bands re-space.
vocabulary:
  # How one holding inside a world is named, and how a moment in its progress
  # is named. {index} counts from zero. Everything that shows either - messages,
  # buttons, and the labels drawn onto the plots - uses these.
  holding: "E{index}"
  moment: "t{index}"

  # How a step of world time is counted out. One step of any world - t3 to t4,
  # whether it was watched or held - is one of these, and a working day is 27
  # of them. Anywhere the game says how much time is left, how long a clean-up
  # takes or how long until a bit is whole again, it says it in these.
  #
  # {n} is the count. Enough of them and the game says "1 day" or "1.5 days"
  # instead - that threshold is a day's length, and lives in the rules.
  step: "{n} neo-hour{n|s::s}"

  # How heavily a holding is contracted - its share of what the specification
  # asks of the world. Least to most; add or remove a word and the bands
  # re-space themselves.
  contracted:
    - unencumbered
    - lightly contracted
    - contracted
    - heavily contracted
    - bound hand and foot

  complexity:
    - simple
    - moderate
    - involved
    - dense
    - labyrinthine

# Plot captions. These are drawn onto an image in a font with no box-drawing
# glyphs or angle brackets, so keep them to plain ASCII.
plots:
  # {world} {gates} {layers}
  # from ^ - {gates} gates over {layers} layers
  # {world} {progress}
  traces_title: "{world} - {moment}"
  # {world} {target} {change}
  traces_running: "{world} - {holding} running {change}"
  traces_legend: "log scale"

# The places a player may be offered. Add, cut and rename freely.
# Tickers for the holdings inside a world. Each world draws as many as it
