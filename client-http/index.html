<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Office 4B, 6 Mackenzie Walk</title>
<style>
  html, body{
    margin: 0;
    padding: 0;
    background-color: #000000;
    color: #FFFFFF;
  }
  header, footer, #choices, #say{
    max-width: 40em;
    text-align: center;
    margin: 0 auto 0.5em;
  }
  footer{
    margin-top: 3em;
  }
  #log{
    max-width: 40em;
    margin: 0 auto;
  }
  .msg { border: 1px solid; padding: 0.5em; margin: 0.5em 0;  }
  img { max-width: 100%; max-height: 33vh; border-bottom: 1px solid white; }
</style>
</head>
<body>
  <header>
    <h1>Office 4B, 6 Mackenzie Walk</h1>
    <p id="status"></p>
  </header>
<div id="log"></div>
<div id="choices"></div>
<form id="say">
  <input id="text" type="text" autocomplete="off" spellcheck="false" placeholder="type a command, or help">
  <button type="submit">send</button>
</form>
<footer><button id="reset" type="button">start over</button></footer>
<script src="app.js" type="module"></script>
</body>
</html>
