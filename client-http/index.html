<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mackenzie Walk Capital</title>
<style>
  html, body{
    margin: 0;
    padding: 0;
    background-color: #000000;
    color: #FFFFFF;
  }
  header, footer, #choices, #say, #account{
    max-width: 40em;
    text-align: center;
    margin: 0 auto 0.5em;
  }
  footer{
    margin-top: 3em;
  }
  #account{
    margin-top: 1.5em;
    color: #909090;
  }
  /* the widget's iframe sits on its own line, centred with everything else */
  #account iframe{
    margin: 0.5em auto 0;
    display: block;
  }
  #log{
    max-width: 40em;
    margin: 0 auto;
  }
  .msg { border: 1px solid; padding: 0.5em; margin: 0.5em 0;  }
  /* someone is still talking - see the pacing note in app.js */
  .msg.typing { border-style: dashed; color: #909090; cursor: pointer; }
  img { max-width: 100%; max-height: 33vh; margin: 0 auto 0.5em; }
</style>
</head>
<body>
  <header>
    <h1>Mackenzie Walk Capital</h1>
    <p id="status"></p>
  </header>
<div id="log"></div>
<div id="choices"></div>
<form id="say">
  <input id="text" type="text" autocomplete="off" spellcheck="false" placeholder="type a command, or help">
  <button type="submit">send</button>
</form>
<footer>
  <button id="reset" type="button">start over</button>
  <div id="account"></div>
</footer>
<script src="app.js" type="module"></script>
</body>
</html>
